name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build assinado e release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      # Sem os secrets de assinatura o build segue e sai um APK não assinado,
      # então um fork ou um repo recém-clonado não quebra o workflow. Um release
      # por tag, porém, exige assinatura: ver o passo "Verificar assinatura".
      - name: Decodificar keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 vazio ou ausente: o APK sairá NÃO assinado."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/copyguru.jks"
          if [ ! -s "$RUNNER_TEMP/copyguru.jks" ]; then
            echo "::error::KEYSTORE_BASE64 decodificou para um arquivo vazio."
            exit 1
          fi
          echo "Keystore decodificada: $(stat -c%s "$RUNNER_TEMP/copyguru.jks") bytes"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build de release
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/copyguru.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      # O passo anterior só sabe se os secrets existem. Quem decide se o APK está
      # mesmo assinado é o apksigner.
      - name: Verificar assinatura
        id: verify
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if "$APKSIGNER" verify "$APK"; then
            echo "APK assinado: $APK"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
              echo "::error::Release por tag exige APK assinado. Confira os secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD."
              exit 1
            fi
            echo "::warning::APK não assinado; seguindo porque não é um release por tag."
          fi

      - name: Renomear artefatos
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-manual}"
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} "dist/copyguru-$VERSION.apk" \;
          ls -la dist

      - name: Publicar artefatos
        uses: actions/upload-artifact@v7
        with:
          name: copyguru-release
          path: dist/*

      - name: Criar release no GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            APK para instalação direta no aparelho.

            **Assinado:** ${{ steps.verify.outputs.signed == 'true' && 'sim' || 'não' }}

            Para instalar: baixe o `.apk` e libere a instalação de apps de fontes desconhecidas.
            Na primeira vez que ligar a bolinha, o Android vai pedir a permissão "Sobrepor a outros apps".

            Atualizar por cima só funciona se o APK novo tiver a mesma assinatura do
            instalado. Assinatura diferente exige desinstalar antes, e isso apaga as copies.
